plugins {
    id 'java'
    id 'application'
}

group = 'eu.amadeos'
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
version = findProperty('appVersion') ?: '0.0.0-dev.0'
// Debian sorts 1.1.0~dev.57 before 1.1.0 (with - it would sort after it).
def debVersion = version.toString().replace('-', '~')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'eu.amadeos.games.cruise.bootstrap.AmadeCruiseApplication'
    // Gamepads on Windows are read through java.lang.foreign; without this, Java warns about it.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // The drive package (the road, its renderer, traffic, driving, panoramas), gamepads, loop, canvas, the
    // mixer with its beds and streamed music, tunes, high scores and the standard game menu; brings
    // amade-commons (theme, Motif look, start-up, XDG).
    // With ../amade-game-engine checked out, settings.gradle builds that checkout instead (composite build).
    implementation 'com.github.amadeos-eu:amade-game-engine:4ae24e454f'

    // The player's own music: decoders that Java Sound finds as service providers (MP3, Ogg Vorbis, FLAC;
    // WAV and AIFF Java reads itself), the same set as amade-audio, so the game needs no music player.
    runtimeOnly 'com.googlecode.soundlibs:jlayer:1.0.1-1'
    runtimeOnly 'com.googlecode.soundlibs:mp3spi:1.9.5-1'
    runtimeOnly 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    runtimeOnly 'com.googlecode.soundlibs:jorbis:0.0.17-2'
    runtimeOnly 'com.googlecode.soundlibs:vorbisspi:1.0.3-1'
    runtimeOnly 'org.jflac:jflac-codec:1.5.2'
    // Tracker modules (MOD, XM, S3M, IT) through libopenmpt, called with JNA; without the library they are skipped.
    implementation 'net.java.dev.jna:jna:5.14.0'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

jar {
    archiveBaseName = 'amade-cruise-game'
    manifest {
        attributes(
            'Main-Class': 'eu.amadeos.games.cruise.bootstrap.AmadeCruiseApplication',
            'Implementation-Title': 'amade-cruise-game',
            'Implementation-Version': project.version,
            // java -jar: the gamepads on Windows call XInput through java.lang.foreign without a warning.
            'Enable-Native-Access': 'ALL-UNNAMED',
            // Java Sound's own converters, which the MP3 and Ogg decoders reach into.
            'Add-Exports': 'java.desktop/com.sun.media.sound'
        )
    }
    dependsOn 'mergeServiceFiles'
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it).matching { exclude 'META-INF/services/**' }
        }
    }
    from(layout.buildDirectory.dir('merged-services'))
    // Signed dependency jars would otherwise invalidate the fat jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The decoders register themselves in META-INF/services; in a fat jar files with the same name
// overwrite each other, so merge them.
tasks.register('mergeServiceFiles') {
    def outputDir = layout.buildDirectory.dir('merged-services')
    outputs.dir outputDir
    inputs.files configurations.runtimeClasspath
    doLast {
        def merged = [:].withDefault { new LinkedHashSet<String>() }
        configurations.runtimeClasspath.each { file ->
            if (!file.name.endsWith('.jar')) return
            def zip = new java.util.zip.ZipFile(file)
            try {
                zip.entries().each { entry ->
                    if (!entry.directory && entry.name.startsWith('META-INF/services/')) {
                        zip.getInputStream(entry).getText('UTF-8').readLines()
                                .collect { it.replaceAll('#.*', '').trim() }
                                .findAll { it }
                                .each { merged[entry.name] << it }
                    }
                }
            } finally {
                zip.close()
            }
        }
        def dir = outputDir.get().asFile
        project.delete(dir)
        merged.each { name, lines ->
            def target = new File(dir, name)
            target.parentFile.mkdirs()
            target.text = lines.join('\n') + '\n'
        }
    }
}

tasks.register('deb') {
    dependsOn jar
    description = 'Builds a standard Debian (.deb) package for amade-cruise-game'
    group = 'distribution'

    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        def stagingDir = new File(buildDirFile, 'deb-staging')
        delete(stagingDir)

        def optDir = new File(stagingDir, 'opt/amade-cruise-game')
        def binDir = new File(stagingDir, 'usr/bin')
        def appDir = new File(stagingDir, 'usr/share/applications')
        def iconDir = new File(stagingDir, 'usr/share/icons/hicolor/48x48/apps')
        def docDir = new File(stagingDir, 'usr/share/doc/amade-cruise-game')
        def debianDir = new File(stagingDir, 'DEBIAN')
        def distDir = new File(buildDirFile, 'distributions')
        [optDir, binDir, appDir, iconDir, docDir, debianDir, distDir]*.mkdirs()

        copy {
            from jar.archiveFile
            into optDir
            rename { 'amade-cruise-game.jar' }
        }

        def launcher = new File(binDir, 'amade-cruise-game')
        launcher.text = """#!/bin/sh
exec /usr/bin/java -jar /opt/amade-cruise-game/amade-cruise-game.jar "\$@"
"""
        launcher.setExecutable(true, false)

        copy {
            from 'packaging/amade-cruise-game.desktop'
            into appDir
        }
        // AppStream metadata: name, description and screenshot for amadeOS Software (and a repository's
        // appstream-generator).
        copy {
            from 'packaging/eu.amadeos.games.cruise.metainfo.xml'
            into new File(stagingDir, "usr/share/metainfo")
        }
        copy {
            from 'src/main/resources/icons/amade-cruise-game.png'
            into iconDir
        }
        copy {
            from 'LICENSE'
            into docDir
            rename { 'copyright' }
        }

        new File(debianDir, 'control').text = """Package: amade-cruise-game
Version: ${debVersion}
Section: games
Priority: optional
Architecture: all
Depends: openjdk-25-jre | java-runtime (>= 25)
Maintainer: amadeOS Project <developers@datazuul.com>
Recommends: libopenmpt0t64 | libopenmpt0
Description: Relaxing drive through endless generated landscapes
 Cruise is a road game seen from behind the car, in the tradition of the
 8-bit road racers. The road never ends: forests and lakes, red canyons
 with tunnels, a coast, an alpine pass, wheat fields, a city at night and
 dream worlds of glowing mushrooms follow one another, with day and night,
 weather, ambient sound and life at the roadside. Overtake slower cars on
 a two-lane road with oncoming traffic, choose your way at the forks, or
 race against computer cars or a second player on the same keyboard in
 split screen. Music built in or from your own files (MP3, Ogg, FLAC,
 WAV, MOD). Keyboard or gamepad. Part of the amadeOS games.
"""

        def debFile = new File(distDir, "amade-cruise-game_${debVersion}_all.deb")
        def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                stagingDir.absolutePath, debFile.absolutePath)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('dpkg-deb failed')
        }
        println "[deb] Created ${debFile.absolutePath}"
    }
}

tasks.register('installToAmadeOs') {
    dependsOn 'deb'
    description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-cruise-game_${debVersion}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}

// Windows installer with jpackage: the fat jar plus a Java runtime, so Windows users need no Java.
// jpackage builds Windows packages only on Windows; MSI and EXE also need WiX Toolset 3 on the PATH.
//   ./gradlew windowsInstaller                           (MSI; output in build/windows/<type>/)
//   ./gradlew windowsInstaller -PinstallerType=exe       (setup .exe)
//   ./gradlew windowsInstaller -PinstallerType=app-image (folder with amade-cruise-game.exe, no WiX needed)
tasks.register('windowsInstaller') {
    dependsOn jar
    description = 'Builds a Windows installer (MSI, EXE or app image) with jpackage'
    group = 'distribution'

    def jdk = javaToolchains.launcherFor { languageVersion = java.toolchain.languageVersion }
    doLast {
        if (!System.getProperty('os.name').startsWith('Windows')) {
            throw new GradleException('jpackage builds Windows packages only on Windows')
        }
        def type = project.findProperty('installerType') ?: 'msi'
        def buildDirFile = layout.buildDirectory.get().asFile
        // jpackage bundles everything in --input, so give it a folder with just the fat jar.
        def inputDir = new File(buildDirFile, 'jpackage-input')
        def destDir = new File(buildDirFile, "windows/$type")
        delete(inputDir, destDir)
        copy {
            from jar.archiveFile
            into inputDir
        }

        def jpackage = jdk.get().metadata.installationPath.file('bin/jpackage.exe').asFile
        def args = [jpackage.absolutePath,
                    '--type', type,
                    '--name', 'amade-cruise-game',
                    // MSI versions are numeric only: 0.1.0-SNAPSHOT becomes 0.1.0
                    '--app-version', project.version.toString().replaceAll(/[^0-9.].*$/, ''),
                    '--vendor', 'datazuul',
                    '--description', 'A relaxing drive through endless generated landscapes',
                    '--copyright', 'datazuul, licensed under the EUPL-1.2',
                    '--input', inputDir.absolutePath,
                    '--main-jar', jar.archiveFile.get().asFile.name,
                    '--main-class', application.mainClass.get(),
                    '--java-options', '--enable-native-access=ALL-UNNAMED',
                    '--icon', file('packaging/windows/amade-cruise-game.ico').absolutePath,
                    '--dest', destDir.absolutePath]
        if (type != 'app-image') {
            args += ['--win-menu', '--win-menu-group', 'amadeOS Games', '--win-shortcut', '--win-dir-chooser',
                     '--license-file', file('LICENSE').absolutePath,
                     // Never change: lets a newer installer replace an installed version.
                     '--win-upgrade-uuid', '9af4af35-ff36-486e-bd39-aea0f1e75014']
        }

        def process = new ProcessBuilder(args).redirectErrorStream(true).start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('jpackage failed')
        }
        destDir.eachFile { println "[windowsInstaller] Created ${it.absolutePath}" }
    }
}

// How long the frames of each region take: ./gradlew benchmark (needs a display; xvfb-run on servers);
// -Pscale=3 for a full screen of 1920 x 1200
tasks.register('benchmark', JavaExec) {
    description = 'Measures the frame times of the regions'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'eu.amadeos.games.cruise.ui.game.Benchmark'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (project.hasProperty('scale')) args project.property('scale')
}

// The screenshots of chapter 61, drawn without a screen: ./gradlew screenshots -Pshots=<folder>
tasks.register('screenshots', JavaExec) {
    description = 'Draws the screenshots of the handbook chapter'
    group = 'documentation'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'eu.amadeos.games.cruise.ui.game.Screenshots'
    args = [project.findProperty('shots') ?: layout.buildDirectory.dir('screenshots').get().asFile.path]
}
